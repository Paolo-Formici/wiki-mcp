[project]
name = "wiki-mcp"
version = "0.2.0"
description = "Fast, read-only MCP server for Karpathy-style LLM markdown wikis (local stdio & remote Streamable HTTP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paolo" }]
dependencies = [
    "mcp[cli]>=1.3.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
wiki-mcp = "wiki_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

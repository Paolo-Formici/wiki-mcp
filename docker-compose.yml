services:
  dev-mcp:
    build: .
    container_name: dev-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - WIKI_DIR=/data/wiki
      - REPO_URL=${REPO_URL:-}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - SYNC_CRON=${SYNC_CRON:-}
    volumes:
      - wiki-data:/data/wiki

volumes:
  wiki-data:
